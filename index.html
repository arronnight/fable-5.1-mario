<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Super Mario 1-1</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:monospace;color:#fff}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#5c94fc}
  #help{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#aaa;user-select:none}
  #touch{position:fixed;inset:0;display:none;pointer-events:none}
  .tb{position:absolute;bottom:18px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
  @media (pointer:coarse){#touch{display:block}#help{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="256" height="240"></canvas></div>
<div id="help">← → 이동 · Z / Shift 달리기(불꽃) · X / Space / ↑ 점프 · ↓ 앉기 · Enter 시작/일시정지 · M 음소거</div>
<div id="touch">
  <div class="tb" data-k="left" style="left:16px">◀</div>
  <div class="tb" data-k="right" style="left:96px">▶</div>
  <div class="tb" data-k="run" style="right:96px">B</div>
  <div class="tb" data-k="jump" style="right:16px">A</div>
</div>

'use strict';
// ============================================================
//  Super Mario Bros. World 1-1 — single-file remake
// ============================================================
const W = 256, H = 240, T = 16;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fitCanvas() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / W, (window.innerHeight - 24) / H)));
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ---------------- Input ----------------
const keys = { left: false, right: false, up: false, down: false, run: false, jump: false };
const pressed = { jump: false, run: false, start: false };
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', ArrowDown: 'down', KeyS: 'down',
  KeyZ: 'run', ShiftLeft: 'run', ShiftRight: 'run',
  KeyX: 'jump', Space: 'jump',
};
window.addEventListener('keydown', e => {
  if (e.code === 'Enter') { if (!e.repeat) pressed.start = true; e.preventDefault(); return; }
  if (e.code === 'KeyM') { if (!e.repeat) Audio.toggleMute(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  if (!keys[k] && (k === 'jump' || k === 'run')) pressed[k] = true;
  keys[k] = true;
  Audio.unlock();
});
window.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) { keys[k] = false; e.preventDefault(); }
});
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
// touch buttons
for (const el of document.querySelectorAll('.tb')) {
  const k = el.dataset.k;
  const on = e => { e.preventDefault(); if (!keys[k] && (k === 'jump' || k === 'run')) pressed[k] = true; keys[k] = true; Audio.unlock(); pressed.start = pressed.start || !Game.running; };
  const off = e => { e.preventDefault(); keys[k] = false; };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
cv.addEventListener('pointerdown', () => { Audio.unlock(); pressed.start = true; });

// ---------------- Audio (tiny synth) ----------------
const Audio = (() => {
  let ac = null, muted = false, musicTimer = null, musicGain = null;
  const unlock = () => {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      musicGain = ac.createGain(); musicGain.gain.value = 0.10; musicGain.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
  };
  // play a sequence of [freq, durSec] on a square/triangle oscillator
  function seq(notes, type = 'square', vol = 0.12, dest) {
    if (!ac || muted) return;
    let t = ac.currentTime;
    for (const [f, d] of notes) {
      if (f > 0) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g); g.connect(dest || ac.destination);
        o.start(t); o.stop(t + d + 0.01);
      }
      t += d;
    }
  }
  function slide(f0, f1, d, type = 'square', vol = 0.12) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.01);
  }

  const sfx = {
    jump: () => slide(N(60), N(72), 0.18, 'square', 0.08),
    bigjump: () => slide(N(55), N(67), 0.22, 'square', 0.08),
    coin: () => seq([[N(83), 0.08], [N(88), 0.35]], 'square', 0.10),
    stomp: () => slide(N(70), N(40), 0.12, 'square', 0.12),
    bump: () => slide(N(50), N(40), 0.08, 'triangle', 0.18),
    break: () => { slide(N(62), N(38), 0.2, 'square', 0.10); slide(N(58), N(34), 0.25, 'triangle', 0.12); },
    powerup: () => seq([[N(60), .05], [N(64), .05], [N(67), .05], [N(72), .05], [N(64), .05], [N(67), .05], [N(72), .05], [N(76), .05], [N(67), .05], [N(72), .05], [N(76), .05], [N(79), .12]], 'square', 0.08),
    appear: () => seq([[N(60), .04], [N(65), .04], [N(69), .04], [N(72), .04], [N(77), .04], [N(81), .04], [N(84), .10]], 'square', 0.07),
    oneup: () => seq([[N(76), .08], [N(79), .08], [N(88), .08], [N(84), .08], [N(86), .08], [N(91), .16]], 'square', 0.09),
    fire: () => slide(N(80), N(60), 0.10, 'square', 0.07),
    kick: () => slide(N(60), N(78), 0.10, 'square', 0.10),
    pipe: () => slide(N(55), N(45), 0.25, 'triangle', 0.15),
    die: () => { stopMusic(); seq([[N(71), .1], [N(77), .1], [0, .1], [N(77), .1], [0, .05], [N(77), .15], [N(76), .15], [N(74), .15], [N(72), .1], [N(67), .1], [N(64), .3], [N(55), .3], [N(48), .5]], 'square', 0.10); },
    gameover: () => { stopMusic(); seq([[N(60), .25], [N(55), .25], [N(52), .5], [N(57), .17], [N(59), .17], [N(57), .17], [N(56), .33], [N(58), .33], [N(56), .6]], 'square', 0.10); },
    flag: () => { stopMusic(); slide(N(60), N(96), 1.2, 'square', 0.08); },
    clear: () => { stopMusic(); seq([[N(67), .12], [N(72), .12], [N(76), .12], [N(79), .12], [N(84), .12], [N(88), .12], [N(91), .35], [N(88), .35], [N(68), .12], [N(72), .12], [N(75), .12], [N(80), .12], [N(84), .12], [N(87), .12], [N(92), .35], [N(87), .35], [N(70), .12], [N(74), .12], [N(77), .12], [N(82), .12], [N(86), .12], [N(89), .12], [N(94), .35], [N(94), .12], [N(94), .12], [N(94), .12], [N(96), .8]], 'square', 0.08); },
    time: () => seq([[N(79), .05], [0, .05], [N(79), .05], [0, .05], [N(79), .05]], 'square', 0.10),
  };

  ];
  let mIdx = 0, bIdx = 0, mTime = 0, bTime = 0, hurry = false;
  function scheduleTrack(track, idxRef, timeRef, type, vol, oct) {
    const step = hurry ? 0.085 : 0.11;
    while (timeRef.t < ac.currentTime + 0.35) {
      const [n, d] = track[idxRef.i];
      if (n) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.value = N(n + oct);
        const dur = d * step;
        g.gain.setValueAtTime(vol, timeRef.t);
        g.gain.setValueAtTime(vol, timeRef.t + dur * 0.7);
        g.gain.linearRampToValueAtTime(0.0001, timeRef.t + dur * 0.95);
        o.connect(g); g.connect(musicGain); o.start(timeRef.t); o.stop(timeRef.t + dur);
      }
      timeRef.t += d * step;
      idxRef.i = (idxRef.i + 1) % track.length;
    }
  }
  const mI = { i: 0 }, mT = { t: 0 }, bI = { i: 0 }, bT = { t: 0 };
  function startMusic() {
    if (!ac || musicTimer) return;
    mI.i = 0; bI.i = 0; mT.t = ac.currentTime + 0.05; bT.t = mT.t;
    musicTimer = setInterval(() => {
      if (muted || !Game.running || Game.paused) { mT.t = Math.max(mT.t, ac.currentTime + 0.05); bT.t = Math.max(bT.t, ac.currentTime + 0.05); return; }
      scheduleTrack(THEME, mI, mT, 'square', 1.0, 0);
      scheduleTrack(BASS, bI, bT, 'triangle', 1.3, -12);
    }, 100);
  }
  function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
  function setHurry(h) { hurry = h; }

  return { unlock, sfx, startMusic, stopMusic, setHurry, toggleMute, get muted() { return muted; } };
})();

function mk(rows, pal = PAL, sub = {}) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    let ch = rows[j][i]; if (ch === '.' || ch === ' ') continue;
    ch = sub[ch] || ch;
    x.fillStyle = pal[ch] || '#f0f'; x.fillRect(i, j, 1, 1);
  }
  return c;
}
function flipH(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0); return c;

// -------- Static background painter (hills / bushes / clouds) --------
function drawHill(x, y, big) {
  // x = world px of left edge, y = ground top; dome shape with dark speckles
  const h = big ? 3 * T + 3 : 2 * T + 3, w = big ? 5 * T : 3 * T, cx = x + w / 2;
  ctx.fillStyle = '#00a800';
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.bezierCurveTo(x + w * 0.3, y - h * 0.15, cx - 14, y - h, cx, y - h);
  ctx.bezierCurveTo(cx + 14, y - h, x + w * 0.7, y - h * 0.15, x + w, y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.fillRect(cx - 1, y - h + 5, 2, 2); ctx.fillRect(cx - 3, y - h + 7, 1, 1); ctx.fillRect(cx + 2, y - h + 7, 1, 1);
  ctx.fillRect(cx - 7, y - h + 16, 2, 2); ctx.fillRect(cx + 5, y - h + 16, 2, 2);
  if (big) { ctx.fillRect(cx - 13, y - 12, 2, 2); ctx.fillRect(cx + 11, y - 12, 2, 2); ctx.fillRect(cx - 3, y - 24, 2, 2); }
}
function drawBush(x, y, n) {
  // n = number of middle segments; y = ground top
  ctx.fillStyle = '#00a800';
  for (let i = 0; i < n + 2; i++) {
    ctx.beginPath(); ctx.arc(x + 8 + i * T, y - 7, 9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#b8f818';
  for (let i = 0; i < n + 2; i++) { ctx.fillRect(x + 3 + i * T, y - 11, 3, 3); ctx.fillRect(x + 9 + i * T, y - 7, 2, 2); }
  ctx.fillStyle = '#00a800'; ctx.fillRect(x + 4, y - 4, (n + 2) * T - 8, 4);
}
function drawCloud(x, y, n) {
  const w = (n + 2) * T;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(x + 4, y + 22); ctx.lineTo(x + w - 4, y + 22);
  ctx.arc(x + w - 4, y + 16, 6, Math.PI / 2, -Math.PI / 2, true);
  ctx.lineTo(x + 4, y + 10); ctx.arc(x + 4, y + 16, 6, -Math.PI / 2, Math.PI / 2, true); ctx.fill();
  for (let i = 0; i < n + 2; i++) { ctx.beginPath(); ctx.arc(x + 8 + i * T, y + 10, 8, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#3cbcfc';
  ctx.fillRect(x + 6, y + 12, 2, 2); ctx.fillRect(x + w - 8, y + 12, 2, 2);
}

// ---------------- Generic tile collision ----------------
// e: {x (center), y (feet), w, h, vx, vy}; returns flags
function isSolidAt(px, py, upward) {
  const tx = Math.floor(px / T), ty = Math.floor(py / T);
  const t = tileAt(tx, ty);
  if (SOLID.has(t)) return true;
  return upward && t === TI.HIDDEN;
}
function moveX(e) {
  e.x += e.vx;
  const hw = e.w / 2, top = e.y - e.h + 2, bot = e.y - 1;
  const mid = (top + bot) / 2;
  if (e.vx > 0) {
    const rx = e.x + hw - 1;
    if (isSolidAt(rx, top) || isSolidAt(rx, mid) || isSolidAt(rx, bot)) {
      e.x = Math.floor(rx / T) * T - hw; return 'right';
    }
  } else if (e.vx < 0) {
    const lx = e.x - hw;
    if (isSolidAt(lx, top) || isSolidAt(lx, mid) || isSolidAt(lx, bot)) {
      e.x = (Math.floor(lx / T) + 1) * T + hw; return 'left';
    }
  }
  return null;
}
function moveY(e) {
  e.y += e.vy;
  const hw = e.w / 2, l = e.x - hw + 1, r = e.x + hw - 2;
  if (e.vy >= 0) {
    if (isSolidAt(l, e.y) || isSolidAt(r, e.y)) {
      e.y = Math.floor(e.y / T) * T; e.vy = 0; return 'ground';
    }
  } else {
    const top = e.y - e.h;
    const hl = isSolidAt(l, top, true), hr = isSolidAt(r, top, true);
    if (hl || hr) {
      e.y = (Math.floor(top / T) + 1) * T + e.h; e.vy = 0;
      // which tile did we hit? prefer the one closer to center
      const tyy = Math.floor(top / T);
      let tx;
      if (hl && hr) { tx = Math.floor(e.x / T); }
      else tx = Math.floor((hl ? l : r) / T);
      return { hit: 'ceiling', tx, ty: tyy };
    }
  }
  return null;
}
function onGroundCheck(e) {
  const hw = e.w / 2;
  return isSolidAt(e.x - hw + 1, e.y) || isSolidAt(e.x + hw - 2, e.y);
}

// ---------------- Mario update ----------------
function jumpVel() {
  const s = Math.abs(mario.vx);
  return s < 1 ? -5.3 : s < 2.2 ? -5.5 : -5.9;
}
function updateMario() {
  const m = mario;
  if (m.growT > 0) { m.growT--; return; }
  if (m.shrinkT > 0) { m.shrinkT--; return; }
  if (m.invuln > 0) m.invuln--;
  if (m.star > 0) { m.star--; }
  if (m.fireT > 0) m.fireT--;

  for (let ty = 0; ty < LH; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const t = World.tiles[idx(tx, ty)];
    if (!t || t === TI.HIDDEN) continue;
    let px = tx * T - cx, py = ty * T;
    const b = Game.bumps.find(b => b.tx === tx && b.ty === ty);
    if (b) py -= b.t < 5 ? b.t * 1.6 : (9 - b.t) * 1.6;
    if (t === TI.PTL) ctx.drawImage(PIPE_TOP, px, py);
    else if (t === TI.PBL) ctx.drawImage(PIPE_BODY, px, py);
    else if (t === TI.PTR || t === TI.PBR) continue;
    else if (t === TI.Q) ctx.drawImage(((Game.frame >> 4) & 3) === 3 ? SPR.qDark : SPR.q, px, py);
    else ctx.drawImage(SPR[TILE_SPR[t]], px, py);
  }
}
function marioSprite() {
  const m = mario;
  const setName = m.power === 2 ? 'fire' : m.power === 1 ? 'big' : 'small';
  let s = SPR[setName];
  let f = m.anim;
  if (m.dead) { s = SPR.small; f = 6; }
  else if (m.growT > 0) { // flicker between sizes
    const ph = (m.growT >> 2) & 1; s = ph ? SPR.small : SPR[m.power === 2 ? 'fire' : 'big']; f = 0;
    if (m.crouch) f = ph ? 0 : 6;
  } else if (m.shrinkT > 0) { const ph = (m.shrinkT >> 2) & 1; s = ph ? SPR.big : SPR.small; f = 0; }
  else if (m.crouch) f = 6;
  else if (m.skid && m.onGround) f = 5;
  if (f === 6 && s === SPR.small) f = 0;
  const img = (m.dir < 0 ? s.L : s.R)[f];
  return img;
}
function drawMario() {
  const m = mario; if (m.hidden) return;
  if (m.invuln > 0 && (m.invuln & 2)) return;
  const img = marioSprite();
  const px = Math.round(m.x - 8 - Game.camX), py = Math.round(m.y - img.height);
  if (m.star > 0 && (m.star > 60 || (Game.frame & 4))) {
    ctx.save(); ctx.filter = `hue-rotate(${(Game.frame * 40) % 360}deg) saturate(2)`; ctx.drawImage(img, px, py); ctx.restore();
  } else ctx.drawImage(img, px, py);
}
function drawEntities() {
  const cx = Game.camX;
  for (const e of Game.entities) {
    const px = Math.round(e.x - 8 - cx);
    if (px < -32 || px > W + 16) continue;
    let img;
    if (e.type === 'goomba') img = e.flat ? SPR.goomba.R[1] : (((e.anim >> 3) & 1) ? SPR.goomba.R[0] : SPR.goomba.L[0]);
    else if (e.type === 'koopa') img = (e.vx > 0 ? SPR.koopa.R : SPR.koopa.L)[(e.anim >> 3) & 1];
    else if (e.type === 'shell') img = SPR.shell;
    else if (e.type === 'item') {
      img = e.kind === 'mush' ? SPR.mush : e.kind === '1up' ? SPR.oneup : e.kind === 'flower' ? SPR.flower : SPR.star;
      if (e.rise > 0) { // clip to the block it emerges from
        ctx.save(); ctx.beginPath(); ctx.rect(px - 4, 0, 24, e.y - e.h + e.rise - 0 + 1); ctx.clip();
        drawSprite(img, px, e.y, e); ctx.restore(); continue;
      }
      if (e.kind === 'flower' || e.kind === 'star') { ctx.save(); ctx.filter = `hue-rotate(${((e.anim >> 2) & 3) * 90}deg)`; drawSprite(img, px, e.y, e); ctx.restore(); continue; }
    } else if (e.type === 'fireball') { ctx.drawImage(FIREBALL[(e.anim >> 2) & 1], px + 6, Math.round(e.y - 5)); continue; }
    drawSprite(img, px, e.y, e);
  }
}
function drawSprite(img, px, feetY, e) {
  if (e.flip) { ctx.save(); ctx.translate(px + 8, Math.round(feetY) - img.height / 2); ctx.scale(1, -1); ctx.drawImage(img, -8, -img.height / 2); ctx.restore(); }
  else ctx.drawImage(img, px, Math.round(feetY - img.height));
}
function drawParticles() {
  const cx = Game.camX;
  for (const p of Game.particles) {
    const px = Math.round(p.x - cx), py = Math.round(p.y);
    if (p.kind === 'debris') { ctx.save(); ctx.translate(px + 4, py + 4); ctx.rotate(p.t * 0.3); ctx.drawImage(SPR.brick, 0, 0, 8, 8, -4, -4, 8, 8); ctx.restore(); }
    else if (p.kind === 'coin') ctx.drawImage(SPR.coin[(p.t >> 1) & 3], px - 8, py - 16);
    else if (p.kind === 'boom') { ctx.fillStyle = '#f83800'; const r = 2 + p.t * 0.5; ctx.beginPath(); ctx.arc(px, py - 3, r, 0, 7); ctx.fill(); ctx.fillStyle = '#fca044'; ctx.beginPath(); ctx.arc(px, py - 3, r * 0.5, 0, 7); ctx.fill(); }
  }
  for (const p of Game.popups) drawText(p.text, Math.round(p.x - cx - 8), Math.round(p.y - 16), '#fff');
}
function drawOverlayBox() { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
function centerText(s, y, color) { ctx.font = '8px monospace'; const w = ctx.measureText(s).width; drawText(s, Math.round((W - w) / 2), y, color); }
function render() {
  const s = Game.state;
  if (s === 'title') {
    drawBackground(); drawTiles();
    // logo box
    ctx.fillStyle = '#c84c0c'; ctx.fillRect(40, 32, 176, 72);
    ctx.fillStyle = '#f8b878'; ctx.fillRect(44, 36, 168, 64);
    ctx.fillStyle = '#c84c0c'; ctx.fillRect(48, 40, 160, 56);
    ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#fff'; ctx.textBaseline = 'top';
    let w = ctx.measureText('SUPER').width; ctx.fillText('SUPER', (W - w) / 2, 44);
    w = ctx.measureText('MARIO BROS.').width; ctx.fillText('MARIO BROS.', (W - w) / 2, 64);
    centerText('WORLD 1-1  REMAKE', 84, '#f8d838');
    ctx.drawImage(SPR.small.R[0], 40, 13 * T - 16);
    if ((Game.frame >> 5) & 1) centerText('PRESS ENTER / TAP TO START', 140, '#fff');
    centerText('Z:RUN/FIRE  X:JUMP  ARROWS:MOVE', 160, '#fff');
    centerText('TOP- ' + pad(Game.best || 0, 6), 184, '#fff');
    drawHUD();
    return;
  }
  if (s === 'intro') {
    drawOverlayBox(); drawHUD();
    centerText('WORLD 1-1', 96);
    ctx.drawImage(SPR.small.R[0], 104, 120); drawText('x  ' + Game.lives, 124, 124);
    return;
  }
  if (s === 'gameover') { drawOverlayBox(); drawHUD(); centerText('GAME OVER', 112); return; }
  drawBackground(); drawTiles(); drawEntities(); drawParticles(); drawMario(); drawHUD();
  if (s === 'cleared') {
    centerText('COURSE CLEAR!', 88, '#f8d838');
    centerText('THANK YOU MARIO!', 104);
    centerText('PRESS ENTER', 136);
    // fireworks
    if (Game.stateT % 40 < 12) {
      const k = Math.floor(Game.stateT / 40) % 3; const fx = [180, 210, 150][k], fy = [60, 90, 100][k];
      ctx.fillStyle = ['#f83800', '#f8d838', '#fff'][Game.stateT % 3];
      for (let a = 0; a < 8; a++) { const r = (Game.stateT % 40) * 1.2; ctx.fillRect(fx + Math.cos(a * 0.785) * r, fy + Math.sin(a * 0.785) * r, 2, 2); }
    }
  }
  if (Game.paused) { ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(0, 0, W, H); centerText('PAUSE', 112); }
}

// ---------------- Main loop (fixed 60Hz) ----------------
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  requestAnimationFrame(loop);
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { if (!Game.manual) update(); acc -= STEP; }
  render();
}
buildLevel();
requestAnimationFrame(loop);
</script>
</body>
